<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1000" />
    <title>DQ7 Lucky Panel Tool</title>
    <style>
      /* Reset & Base */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }
      #article-body {
        max-width: 700px;
        margin: 30px auto;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      ol,
      ul {
        list-style: none;
      }

      /* DQ7 Lucky Panel Tool CSS */
      .w-dq7-panel-tool {
        margin-bottom: 15px;
      }
      .w-dq7-panel-tool .w-mode-tab {
        display: flex;
        margin-bottom: 15px;
      }
      .w-dq7-panel-tool .w-mode-tab > li {
        display: block;
        width: 25%;
      }
      .w-dq7-panel-tool .w-mode-tab > li > input[type="radio"] {
        display: none;
      }
      .w-dq7-panel-tool .w-mode-tab > li > input[type="radio"] + label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        line-height: 1;
        text-align: center;
        padding: 10px 0;
        border-radius: 5px;
        cursor: pointer;
        color: gray;
        background-color: #fff;
      }
      .w-dq7-panel-tool .w-mode-tab > li > input[type="radio"]:checked + label {
        background-image: linear-gradient(
          to bottom,
          #606060,
          #404040 50%,
          #303030 51%,
          #606060
        );
        color: #fff;
      }
      .w-dq7-panel-tool .w-panel-guide {
        margin-bottom: 10px;
        text-align: center;
        font-weight: 700;
        color: #ea2a3d;
        font-size: 13px;
      }
      .w-dq7-panel-tool .w-panel-guide.is-input {
        font-size: 15px;
      }
      .w-dq7-panel-tool .w-panel-guide.is-shuffle {
        font-size: 13px;
      }
      .w-dq7-panel-tool .w-panel-guide.is-finish {
        font-size: 15px;
      }
      .w-dq7-panel-tool .w-panel-guide ._shuffle-count {
        color: #f4511e;
        background-color: #fff176;
        margin-top: 5px;
        border-radius: 2px;
        padding: 3px 0;
      }
      .w-dq7-panel-tool .w-panel-wrap {
        display: grid;
        background-color: #f2f2f2;
        border: solid 1px #e5e5e5;
        border-radius: 8px;
        gap: 7px;
        padding: 7px;
      }
      .w-dq7-panel-tool .w-panel-wrap.is-4x3 {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 100px);
        line-height: 94px;
      }
      .w-dq7-panel-tool .w-panel-wrap.is-4x4 {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 90px);
        line-height: 84px;
      }
      .w-dq7-panel-tool .w-panel-wrap.is-5x4 {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(4, 80px);
        line-height: 74px;
      }
      .w-dq7-panel-tool .w-panel-wrap.is-6x4 {
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(4, 80px);
        line-height: 74px;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel {
        border: solid 1px #f2f2f2;
        border-radius: 5px;
        text-align: center;
        font-size: 30px;
        font-weight: 700;
        background-color: #fff;
        cursor: pointer;
        position: relative;
        box-shadow: 0 0 3px 1px #64646433;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel.is-selected {
        border-color: #ea2a3d !important;
        background-color: #ff5252 !important;
        transform: scale(1.15);
        transition: all 0.2s;
        z-index: 50;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel.is-back {
        background-image: url(https://img.gamewith.jp/article_tools/dq7/gacha/dq7-card-back-image.jpg);
        background-size: 80px;
        border: solid 5px #fff;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="A"] {
        background-color: #4fc3f7;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="B"] {
        background-color: #ffa726;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="C"] {
        background-color: #d4e157;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="D"] {
        background-color: #4db6ac;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="E"] {
        background-color: #ba68c8;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="F"] {
        background-color: #a1887f;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="G"] {
        background-color: #4dd0e1;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="H"] {
        background-color: #ffd54f;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="I"] {
        background-color: #7986cb;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="J"] {
        background-color: #90a4ae;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="K"] {
        background-color: #81c784;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="X"] {
        font-size: 35px;
        background-color: #edece5;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="X"] > img {
        width: 70%;
        margin: 0 auto !important;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="Y"] {
        color: #fff;
        background-color: #404040;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel[panel="Y"] > img {
        width: 80%;
        margin: 0 auto !important;
      }
      .w-dq7-panel-tool .w-panel-wrap > .w-panel:after {
        display: block;
        content: attr(logs);
        position: absolute;
        width: 100%;
        height: 20px;
        top: 4px;
        left: 4px;
        font-size: 14px;
        line-height: 1;
        text-align: left;
        color: #ea2a3d;
        font-weight: 700;
      }
      .w-dq7-panel-tool .w-panel-next-button {
        display: block;
        margin-top: 10px;
        color: #fff;
        border: solid 1px #f44336;
        background-image: linear-gradient(
          to bottom,
          #ef5350,
          #e53935 50%,
          #d32f2f 51%,
          #f44336
        );
        text-align: center;
        font-size: 16px;
        line-height: 1;
        font-weight: 700;
        padding: 12px 0;
        border-radius: 5px;
        cursor: pointer;
      }
      .w-dq7-panel-tool .w-panel-next-button:active {
        color: #fff;
        opacity: 0.8;
        transition: all 0.3s;
      }
      .w-dq7-panel-tool .w-panel-buttons {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .w-dq7-panel-tool .w-panel-buttons > ._button {
        width: 100%;
        text-align: center;
        border: solid 1px #c0c0c0;
        padding: 10px;
        font-weight: 700;
        border-radius: 5px;
        cursor: pointer;
        background-image: linear-gradient(
          to bottom,
          #fff,
          #f0f0f0 50%,
          #e7e7e7 51%,
          #fcfcfc
        );
      }
      .w-dq7-panel-tool .w-panel-buttons > ._button:active {
        color: #fff;
        background-image: linear-gradient(
          to bottom,
          gray,
          #404040 50%,
          #303030 51%,
          gray
        );
        border-color: gray;
      }
      .w-dq7-panel-tool.is-2column .w-panel-wrap.is-4x3 {
        grid-template-rows: repeat(3, 120px);
        line-height: 114px;
      }
      .w-dq7-panel-tool.is-2column .w-panel-wrap.is-4x3 > .w-panel {
        font-size: 40px;
      }
      .w-dq7-panel-tool.is-2column
        .w-panel-wrap.is-4x3
        > .w-panel[panel="X"]
        > img {
        width: 53%;
        margin: 0 auto !important;
      }
      .w-dq7-panel-tool.is-2column
        .w-panel-wrap.is-4x3
        > .w-panel[panel="Y"]
        > img {
        width: 60%;
        margin: 0 auto !important;
      }
      .w-dq7-panel-tool.is-2column .w-panel-wrap.is-4x4 {
        grid-template-rows: repeat(4, 100px);
        line-height: 94px;
      }
      .w-dq7-panel-tool.is-2column .w-panel-wrap.is-4x4 > .w-panel {
        font-size: 32px;
      }
      .w-dq7-panel-tool.is-2column
        .w-panel-wrap.is-4x4
        > .w-panel[panel="X"]
        > img {
        width: 48%;
        margin: 0 auto !important;
      }
      .w-dq7-panel-tool.is-2column
        .w-panel-wrap.is-4x4
        > .w-panel[panel="Y"]
        > img {
        width: 50%;
        margin: 0 auto !important;
      }
      .w-dq7-panel-tool.is-2column .w-panel-wrap.is-5x4 {
        grid-template-rows: repeat(4, 100px);
        line-height: 94px;
      }
      .w-dq7-panel-tool.is-2column .w-panel-wrap.is-5x4 > .w-panel {
        font-size: 32px;
      }
      .w-dq7-panel-tool.is-2column
        .w-panel-wrap.is-5x4
        > .w-panel[panel="X"]
        > img {
        width: 60%;
        margin: 0 auto !important;
      }
      .w-dq7-panel-tool.is-2column
        .w-panel-wrap.is-5x4
        > .w-panel[panel="Y"]
        > img {
        width: 70%;
        margin: 0 auto !important;
      }
      .w-dq7-panel-tool.is-2column .w-panel-wrap.is-6x4 {
        grid-template-rows: repeat(4, 100px);
        line-height: 94px;
      }
      .w-dq7-panel-tool.is-2column
        .w-panel-wrap.is-6x4
        > .w-panel[panel="X"]
        > img {
        width: 70%;
        margin: 0 auto !important;
      }
      .w-dq7-panel-tool.is-2column
        .w-panel-wrap.is-6x4
        > .w-panel[panel="Y"]
        > img {
        width: 80%;
        margin: 0 auto !important;
      }
    </style>
  </head>
  <body>
    <div id="article-body">
      <div id="Dq7LuckyPanelTool"></div>
    </div>

    <!-- jQuery (required by the tool's initialization) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- DQ7 Lucky Panel Tool (Vue 3 + Pinia bundled) -->
    <script src="dq7-lucky-panel-tool.min.js"></script>
  </body>
</html>
